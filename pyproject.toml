[project]
name = "mars-rover-problem"
version = "1.0.0"
description = "NASA Mars Rover kata solution in Python"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "CC-BY-SA-4.0" }
authors = [
    {name = "Imane Messak", email = "messak.imane@gmail.com"},
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
    "ruff",
    "bandit[toml]",   # [toml] extra allows bandit to read pyproject.toml config
    "safety",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project.scripts]
mars-rover = "mars_rover.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.bandit]
targets = ["src/"]
skips = ["B101"] 
