[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mars-rover-problem"
version = "0.1.0"
description = "NASA Mars Rover kata — Python OOP solution"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
    "ruff",
    "bandit[toml]",   # [toml] extra allows bandit to read pyproject.toml config
    "safety",
]

[project.scripts]
mars-rover = "mars_rover.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.bandit]
targets = ["src/"]
skips = ["B101"] 

[tool.semantic_release]
version_toml          = ["pyproject.toml:project.version"]
branch                = "main"
changelog_file        = "CHANGELOG.md"
build_command         = "pip install build && python -m build"
upload_to_pypi        = false
upload_to_release     = true
commit_message        = "chore(release): v{version} [skip ci]"

[tool.semantic_release.commit_parser_options]
minor_tags = ["feat"]
patch_tags = ["fix", "perf"]